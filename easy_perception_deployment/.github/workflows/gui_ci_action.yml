name: GUI_CI

on: [push, pull_request]

jobs:
  python_ci:
    strategy:
      matrix:
        python-version: ["3.10"]
    env:
      QT_QPA_PLATFORM: "offscreen"

    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pycodestyle
          python -m pip install PySide2==5.15.0
          python -m pip install dateutils==0.6.12
          python -m pip install pycocotools==2.0.7
          python -m pip install labelme==5.0.1
          python -m pip install pytest==6.0.1
          python -m pip install pytest-qt==3.3.0
          python -m pip install pyyaml==5.4.1
      - name: Static Analysis
        run: |
          pycodestyle --show-source easy_perception_deployment/gui/main.py \
          easy_perception_deployment/gui/test_gui.py \
          easy_perception_deployment/gui/test_gui_gpu_local_only.py \
          easy_perception_deployment/gui/windows/*.py \
          easy_perception_deployment/gui/trainer/*.py --count
      - name: Dynamic Analysis
        run: |
          cd easy_perception_deployment/gui
          pytest --capture=no -vv test_gui.py
