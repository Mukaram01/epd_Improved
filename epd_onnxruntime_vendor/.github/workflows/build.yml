name: VENDOR_BUILD

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 0'

jobs:
  humble_vendor_ci:
    runs-on: ubuntu-22.04
    env:
      ROS_DISTRO: humble
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up ROS ${{ env.ROS_DISTRO }}
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: ${{ env.ROS_DISTRO }}

      - name: Install system dependencies
        working-directory: epd_onnxruntime_vendor
        run: |
          sudo apt-get update
          sudo rosdep init || true
          rosdep update
          rosdep install --from-paths . --ignore-src -r -y --rosdistro $ROS_DISTRO

      - name: Build vendor package
        run: |
          source /opt/ros/$ROS_DISTRO/setup.bash
          colcon build --packages-select epd_onnxruntime_vendor --event-handlers console_direct+

      - name: Test vendor package
        run: |
          source /opt/ros/$ROS_DISTRO/setup.bash
          colcon test --packages-select epd_onnxruntime_vendor --event-handlers console_direct+
          colcon test-result --verbose
